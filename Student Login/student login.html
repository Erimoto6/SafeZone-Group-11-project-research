<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>SafeZone - User Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
 <div class="login-container">

<!--School Logo Background-->
<img src="school-logo.png" class="school-logo" alt="School Logo">

<!--Login Content-->
<div class="login-content">

<h1>SafeZone</h1>
<p class="subtitle">User Login</p>

<form>
<label for="student-number">Student Number:</label>
<input type="text" id="student-number" name="student-number" placeholder="Student Number"required>  

<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Password" required>

<div class="remember">
    <input type="checkbox" id="remember" name="remember">
    <label for="remember">Remember me</label>
</div>

<button type="submit">Log In</button>
</form>

 </div>   
    </body>
</html>
